<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroDesk — Remote Desktop（浏览器原生 WebRTC）</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { background:#111; color:#eee; font-family: system-ui, sans-serif; margin:0; padding:16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color:#888; font-size:12px; margin-bottom:12px; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    input, select, button { padding:6px 10px; font-size:14px; border-radius:6px; border:1px solid #333; background:#1c1c1c; color:#eee; }
    button { cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.primary { background:#2ea043; border-color:#2ea043; }
    #status { font-size:13px; }
    #ice { font-size:12px; color:#888; }
    .wrap { position:relative; background:#000; border-radius:8px; overflow:hidden; }
    video { display:block; width:100%; max-height:70vh; background:#000; }
    .placeholder { display:flex; align-items:center; justify-content:center; height:200px; color:#555; font-size:14px; }
    #log { margin-top:10px; background:#0d0d0d; border:1px solid #222; border-radius:6px; padding:8px; font: 11px/1.5 ui-monospace, monospace; max-height:160px; overflow:auto; white-space:pre-wrap; color:#9aa; }
    @media (max-width: 600px) {
        body { padding:8px; }
        input { flex:1; min-width:0; }
        .bar { flex-direction: column; align-items: stretch; }
    }
</style>
</head>
<body>
    <h1>AeroDesk</h1>
    <div class="sub">浏览器原生 WebRTC · 观看端/发布端（与原生客户端互通）</div>
    <div class="bar">
        <select id="role">
            <option value="viewer">观看端</option>
            <option value="publisher">发布端（共享屏幕）</option>
        </select>
        <input id="room" placeholder="房间" value="demo">
        <input id="signal" placeholder="信令（默认 wss://host:3001/ws）" value="">
        <input id="token" placeholder="JWT（可选，仅本页读取）" type="password" value="">
        <button id="connect" class="primary">连接</button>
        <button id="disconnect" disabled>断开</button>
    </div>
    <div id="status">未连接</div>
    <div id="ice"></div>
    <div class="wrap">
        <video id="video" autoplay playsinline muted></video>
        <div id="placeholder" class="placeholder">等待媒体流…（观看端在视频上移动/点击即发送输入）</div>
    </div>
    <div class="wrap">
        <input id="file" type="file" disabled>
        <button id="sendfile" disabled>发送文件到被控端</button>
        <span id="fileinfo"></span>
        <span id="clipboard"></span>
    </div>
    <div id="log"></div>

<script>
'use strict';
// ---------- 参数（仅用于预填；运行期从输入框取值） ----------
const params = new URLSearchParams(location.search);
const rawRole = params.get('role') || 'viewer';
// #21：前端校验角色
const ROLE = (rawRole === 'publisher') ? 'publisher' : 'viewer';
const ROOM_PREFILL = params.get('room') || 'demo';
let SIGNAL_OVERRIDE = params.get('signal') || '';
const TOKEN_PREFILL = params.get('token') || '';

const byId = (id) => document.getElementById(id);
const $ = byId;

$('role').value = ROLE;
$('room').value = ROOM_PREFILL;
$('token').value = TOKEN_PREFILL;

let rtc = null, ws = null, peerId = null, inputChannel = null, signalChannel = null;
let pending = [], inputSeq = 0, closed = false, redirecting = false, screenStream = null;
// #175 自动重连：WS 断开/ICE 失败 → 指数退避重连（≤RECONNECT_MAX，成功重置；手动断开不重连）。
let reconnectAttempts = 0;
let reconnectTimer = null;
let connecting = false;
const RECONNECT_MAX = 5;

function reconnectDelay() {
    // 1s、2s、4s、8s，之后封顶 10s
    return Math.min(10, Math.pow(2, reconnectAttempts - 1)) * 1000;
}
function scheduleReconnect(reason) {
    if (closed || reconnectTimer) return;
    if (reconnectAttempts >= RECONNECT_MAX) {
        setStatus('重连失败（已达上限）: ' + reason);
        log('重连已达上限，请手动连接');
        return;
    }
    reconnectAttempts += 1;
    const delay = reconnectDelay();
    log(`重连 ${reconnectAttempts}/${RECONNECT_MAX}：${reason}，${delay / 1000}s 后重试`);
    setStatus(`重连中 ${reconnectAttempts}/${RECONNECT_MAX}…`);
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, delay);
}

// ---------- 信令 ----------

function log(msg) {
    const el = $('log');
    el.innerText += new Date().toISOString().slice(11, 19) + ' ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
}
function setStatus(s) { $('status').innerText = s; }
function setIce(s) { $('ice').innerText = 'ICE: ' + s; }

// ---------- 信令 ----------
function signalURL() {
    if (SIGNAL_OVERRIDE) return SIGNAL_OVERRIDE;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const port = location.protocol === 'https:' ? 3001 : 3003;
    return `${proto}//${location.hostname}:${port}/ws`;
}
function sendSignal(msg) { ws.send(JSON.stringify(msg)); }

// #19：pending 队列按消息类型匹配 + 超时 + 可重置
function nextSignal(type, timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
        const item = { type, resolve, reject };
        pending.push(item);
        setTimeout(() => {
            const i = pending.indexOf(item);
            if (i >= 0) { pending.splice(i, 1); reject(new Error('信令超时: ' + type)); }
        }, timeoutMs);
    });
}
function resetPending(err) {
    for (const p of pending.splice(0)) p.reject(err || new Error('连接已重置'));
}

// #146 多 PoP：等待 types 中任一类型消息（join 需同时处理 joined/redirect）。
function nextSignalTypes(types, timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
        const item = { type: null, types, resolve, reject };
        pending.push(item);
        setTimeout(() => {
            const i = pending.indexOf(item);
            if (i >= 0) { pending.splice(i, 1); reject(new Error('信令超时: ' + types.join('/'))); }
        }, timeoutMs);
    });
}

// #146 多 PoP：加入房间，自动跟随信令重定向（最多 maxHops 跳防环）。
async function joinWithRedirect(token, maxHops = 3) {
    for (let hop = 0; hop <= maxHops; hop++) {
        await connectSignal();
        sendSignal({ type: 'join', room: $('room').value || 'demo', role: ROLE, auth_token: token });
        const msg = await nextSignalTypes(['joined', 'redirect']);
        if (msg.type === 'redirect') {
            log(`多 PoP 重定向（hop ${hop}/${maxHops}）→ ${msg.url}（${msg.pop}）`);
            setStatus('信令重定向到 ' + msg.pop + '…');
            redirecting = true;
            ws.close();
            redirecting = false;
            resetPending();
            SIGNAL_OVERRIDE = msg.url;   // 下一次 connectSignal 使用新地址
            continue;
        }
        return msg; // joined
    }
    throw new Error('too many signal redirects');
}

async function connectSignal() {
    await new Promise((resolve, reject) => {
        ws = new WebSocket(signalURL());
        ws.onopen = resolve;
        ws.onerror = () => reject(new Error('信令连接失败: ' + signalURL()));
    });
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        // #19 补充：服务端 error（如 auth failed）fail-fast，reject 所有等待项
        if (msg.type === 'error') {
            const err = new Error('信令错误: ' + (msg.message || 'unknown'));
            resetPending(err);
            setStatus(err.message);
            log('signal error: ' + (msg.message || e.data));
            return;
        }
        // 按类型匹配首个等待项（支持 nextSignalTypes 的 types 数组）
        const idx = pending.findIndex((p) =>
            p.types ? p.types.includes(msg.type) : p.type === msg.type);
        if (idx >= 0) {
            const [item] = pending.splice(idx, 1);
            item.resolve(msg);
        } else {
            log('signal: ' + e.data);
        }
    };
    ws.onclose = () => {
        if (!closed && !redirecting) {
            setStatus('信令断开');
            log('signaling closed');
            scheduleReconnect('信令断开');
        }
    };
    log('signaling connected: ' + signalURL());
}

// ---------- ICE：非 trickle 需等 gathering 完成（#17） ----------
function waitIceGatheringComplete() {
    if (rtc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((resolve) => {
        const onState = () => {
            if (rtc.iceGatheringState === 'complete') {
                rtc.removeEventListener('icegatheringstatechange', onState);
                clearTimeout(timer);
                resolve();
            }
        };
        // 兜底：15s 后带当前已收集候选继续（非 trickle 的最佳努力）
        const timer = setTimeout(() => {
            rtc.removeEventListener('icegatheringstatechange', onState);
            resolve();
        }, 15000);
        rtc.addEventListener('icegatheringstatechange', onState);
    });
}
async function localSdp() {
    await waitIceGatheringComplete();
    return JSON.stringify(rtc.localDescription);
}

// ---------- 输入事件（InputFrame 协议） ----------
function normPos(e, el) {
    const rect = el.getBoundingClientRect();
    return {
        x: Math.min(1, Math.max(0, (e.clientX - rect.left) / (rect.width || 1))),
        y: Math.min(1, Math.max(0, (e.clientY - rect.top) / (rect.height || 1))),
    };
}
function sendInput(event) {
    if (!inputChannel || inputChannel.readyState !== 'open') return;
    const frame = { version: 1, seq: inputSeq++, timestamp_ms: Date.now(), event };
    inputChannel.send(JSON.stringify(frame));
}
const BTN = { 0: 'left', 1: 'middle', 2: 'right', 3: 'back', 4: 'forward' };
function modifiers(e) { return { ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey }; }
function bindInput(el) {
    el.addEventListener('mousemove', (e) => sendInput({ type: 'mouse_move', ...normPos(e, el) }));
    el.addEventListener('mousedown', (e) => sendInput({ type: 'mouse_button', button: BTN[e.button] || 'left', state: 'pressed', ...normPos(e, el) }));
    el.addEventListener('mouseup', (e) => sendInput({ type: 'mouse_button', button: BTN[e.button] || 'left', state: 'released', ...normPos(e, el) }));
    el.addEventListener('wheel', (e) => { e.preventDefault(); sendInput({ type: 'wheel', ...normPos(e, el), delta_x: e.deltaX || 0, delta_y: e.deltaY || 0 }); }, { passive: false });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); sendInput({ type: 'mouse_button', button: 'right', state: 'pressed', ...normPos(e, el) }); });
    el.addEventListener('touchstart', (e) => touch(e, 'down'), { passive: true });
    el.addEventListener('touchmove', (e) => touch(e, 'move'), { passive: true });
    el.addEventListener('touchend', (e) => touch(e, 'up'), { passive: true });
    el.addEventListener('touchcancel', (e) => touch(e, 'cancel'), { passive: true });
    window.addEventListener('keydown', (e) => sendInput({ type: 'key', code: e.code, state: 'pressed', modifiers: modifiers(e) }));
    window.addEventListener('keyup', (e) => sendInput({ type: 'key', code: e.code, state: 'released', modifiers: modifiers(e) }));
}
function touch(e, action) {
    for (const t of e.changedTouches) {
        const rect = $('video').getBoundingClientRect();
        sendInput({ type: 'touch', touch_id: t.identifier, action,
            x: Math.min(1, Math.max(0, (t.clientX - rect.left) / (rect.width || 1))),
            y: Math.min(1, Math.max(0, (t.clientY - rect.top) / (rect.height || 1))), });
    }
}

// ---------- WebRTC ----------
function setupRtc(iceServers) {
    rtc = new RTCPeerConnection({ iceServers });
    rtc.oniceconnectionstatechange = () => {
        setIce(rtc.iceConnectionState);
        if (rtc.iceConnectionState === 'failed' || rtc.iceConnectionState === 'disconnected') {
            setStatus('连接中断（ICE: ' + rtc.iceConnectionState + '）');
            scheduleReconnect('ICE: ' + rtc.iceConnectionState);
        }
    };
    rtc.onicecandidate = () => { /* v1 非 trickle：candidate 内嵌 SDP */ };

    // #20 修复：publisher 屏幕共享 track 必须在初始 offer 前加入（SFU 信令模型
    // 只处理 WS 信令的 SDP 交换，data channel 重协商不生效 → 媒体发不出去）。
    if (ROLE === 'publisher' && screenStream) {
        const track = screenStream.getVideoTracks()[0];
        if (track) {
            rtc.addTransceiver(track, { direction: 'sendonly', streams: [screenStream] });
            log('屏幕共享已加入连接（初始 offer）');
        }
    }

    signalChannel = rtc.createDataChannel('offer/answer');
    signalChannel.onmessage = (event) => {
        const json = JSON.parse(event.data);
        if (json.type === 'offer') handleOffer(event.data);
        else if (json.type === 'answer') {
            // negotiate() 的应答（data channel，与信令 WS 的 pending 队列分离）
            if (dcAnswerResolve) { dcAnswerResolve(event.data); dcAnswerResolve = null; }
        }
    };
    signalChannel.onopen = () => {
        inputChannel = rtc.createDataChannel('input');
        inputChannel.onopen = () => log('input channel open');
        inputChannel.onmessage = (e) => log('input event: ' + e.data);
        // #72/#192（ADR-0007）：file 通道 in-band DCEP 创建（连接后由 SCTP 直通，
        // 无需 SDP 重协商；勿设 negotiated:true——SFU 感知不到 label 会丢弃）。
        fileChannel = rtc.createDataChannel('file');
        fileChannel.onopen = () => {
            $('file').disabled = false;
            $('sendfile').disabled = false;
            log('file channel open');
        };
        fileChannel.onmessage = (e) => {
            if (typeof e.data === 'object') return;
            try {
                const ctrl = JSON.parse(e.data);
                // #72 FileControl：serde tag="type" snake_case（{"type":"nack"|"done"|"clipboard"}）
                if (ctrl.type === 'nack' && pendingMeta && ctrl.id === pendingMeta.id) {
                    for (const idx of ctrl.missing) {
                        const d = pendingChunks.get(idx);
                        if (d) fileChannel.send(encodeChunk(pendingMeta.id, idx, d));
                    }
                    log(`file resend ${ctrl.missing.length} chunks`);
                } else if (ctrl.type === 'done' && ctrl.id === (pendingMeta && pendingMeta.id)) {
                    log(`file confirmed by receiver: ok=${ctrl.ok}`);
                } else if (ctrl.type === 'clipboard') {
                    $('clipboard').innerText = '剪贴板: ' + ctrl.text;
                }
            } catch (_) {}
        };
        if (ROLE === 'viewer') {
            log('viewer ready — 在视频上移动/点击发送输入；可选择文件发送到被控端');
        }
    };

    rtc.ontrack = (e) => {
        const video = $('video');
        video.srcObject = e.streams[0] || new MediaStream([e.track]);
        video.play().catch(() => {});
        $('placeholder').style.display = 'none';
        log('received track: ' + e.track.kind);
    };
}

let dcAnswerResolve = null;
async function negotiate() {
    const offer = await rtc.createOffer();
    await rtc.setLocalDescription(offer);
    await waitIceGatheringComplete();               // #17
    await signalChannel.send(JSON.stringify(rtc.localDescription));
    const answer = await Promise.race([
        new Promise((resolve) => { dcAnswerResolve = resolve; }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('重协商超时')), 20000)),
    ]);
    dcAnswerResolve = null;
    await rtc.setRemoteDescription(JSON.parse(answer));
}
async function handleOffer(json) {
    const offer = JSON.parse(json);
    await rtc.setRemoteDescription(offer);
    const answer = await rtc.createAnswer();
    await rtc.setLocalDescription(answer);
    await waitIceGatheringComplete();               // #17
    await signalChannel.send(JSON.stringify(rtc.localDescription));
}

// ---------- 发布端：点击时先授权屏幕共享（#20） ----------
async function acquireScreen() {
    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
        screenStream.getVideoTracks()[0].addEventListener('ended', () => log('屏幕共享结束'));
        log('屏幕共享已授权');
    } catch (e) {
        log('屏幕共享被拒绝: ' + e.message);
        throw new Error('屏幕共享被拒绝');
    }
}

// ---------- 连接 ----------
async function connect() {
    if (connecting) return;
    connecting = true;
    closed = false;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    $('connect').disabled = true;
    $('disconnect').disabled = false;
    setStatus('连接中…');
    try {
        // #18：token 从输入框读取（URL 仅预填）
        const token = byId('token').value || null;

        // #20：发布端在用户点击手势内先请求屏幕共享（重连时复用已有流，不再弹授权）
        if (ROLE === 'publisher' && !screenStream) {
            setStatus('请求屏幕共享授权…');
            await acquireScreen();
        }

        setStatus('连接信令…');
        const joined = await joinWithRedirect(token);
        peerId = joined.peer_id;
        setStatus('已加入房间，peer=' + peerId);

        let iceServers = [];
        if (joined.turn && joined.turn.urls) {
            iceServers = [{ urls: joined.turn.urls, username: joined.turn.username, credential: joined.turn.credential }];
            log('TURN relay: ' + joined.turn.urls.join(', '));
        }
        setupRtc(iceServers);

        const offer = await rtc.createOffer();
        await rtc.setLocalDescription(offer);
        const sdp = await localSdp();               // #17：等 gathering 完成
        sendSignal({ type: 'description', from: peerId, to: 'sfu', description: sdp });
        const resp = await nextSignal('description');
        await rtc.setRemoteDescription(JSON.parse(resp.description));
        setStatus('已连接');
        log('SDP 交换完成，等待媒体…');
        reconnectAttempts = 0;   // 成功即重置重连计数
    } catch (e) {
        setStatus('连接失败: ' + e.message);
        log('error: ' + e);
        stopScreen();
        if (!closed) scheduleReconnect(e.message);
    } finally {
        connecting = false;
        $('connect').disabled = false;
    }
}

function stopScreen() {
    if (screenStream) {
        for (const t of screenStream.getTracks()) t.stop();
        screenStream = null;
    }
}

// ---------- 文件传输（#72 协议：file data channel + 8KB 分片 + Nack 重传） ----------
let fileChannel = null;
let pendingChunks = new Map(); // chunk index -> Uint8Array（Nack 重传用）
let pendingMeta = null;

function encodeChunk(id, index, data) {
    const idBytes = new TextEncoder().encode(id);
    const out = new Uint8Array(1 + 4 + idBytes.length + 8 + data.length);
    out[0] = 0x01; // CHUNK_MAGIC
    const dv = new DataView(out.buffer);
    dv.setUint32(1, idBytes.length, true);
    out.set(idBytes, 5);
    dv.setBigUint64(5 + idBytes.length, BigInt(index), true);
    out.set(data, 5 + idBytes.length + 8);
    return out;
}

async function sha256Hex(buf) {
    const d = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function sendFile(file) {
    if (!fileChannel || fileChannel.readyState !== 'open') {
        log('文件通道未就绪');
        return;
    }
    const id = 'web-' + Date.now();
    const chunks = Math.ceil(file.size / 8192);
    const buf = await file.arrayBuffer();
    const hash = await sha256Hex(buf);
    pendingMeta = { id, name: file.name, size: file.size, chunks, hash };
    pendingChunks.clear();
    $('fileinfo').innerText = `发送 ${file.name} (${file.size} B, ${chunks} 分片)…`;
    log(`file send start: ${file.name} ${file.size}B chunks=${chunks}`);
    // Meta（#72 FileControl：{"type":"meta", id,name,size,chunks,hash}）
    fileChannel.send(JSON.stringify({ type: 'meta', ...pendingMeta }));
    // 分片（批量发送，避免阻塞）
    for (let i = 0; i < chunks; i++) {
        const data = new Uint8Array(buf.slice(i * 8192, Math.min((i + 1) * 8192, file.size)));
        pendingChunks.set(i, data);
        fileChannel.send(encodeChunk(id, i, data));
        if (i % 64 === 63) await new Promise(r => setTimeout(r, 0)); // 让出事件循环
    }
    // Done（接收端补包确认前仍响应 Nack 重传）
    fileChannel.send(JSON.stringify({ type: 'done', id, ok: true }));
    $('fileinfo').innerText = `已发送完成 ${file.name}`;
    log(`file send done: ${file.name}`);
}

function bindFile() {
    $('sendfile').addEventListener('click', () => {
        const f = $('file').files[0];
        if (f) sendFile(f);
    });
}

function disconnect() {
    closed = true;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    reconnectAttempts = 0;
    resetPending();
    dcAnswerResolve = null;
    if (inputChannel) { try { inputChannel.close(); } catch (_) {} }
    if (fileChannel) { try { fileChannel.close(); } catch (_) {} }
    if (signalChannel) { try { signalChannel.close(); } catch (_) {} }
    if (rtc) rtc.close();
    if (ws) ws.close();
    stopScreen();
    rtc = null; ws = null; peerId = null; inputChannel = null; signalChannel = null; fileChannel = null;
    pendingChunks.clear(); pendingMeta = null;
    $('file').disabled = true; $('sendfile').disabled = true; $('fileinfo').innerText = '';
    $('video').srcObject = null;
    $('placeholder').style.display = 'flex';
    setStatus('已断开');
    setIce('');
    $('connect').disabled = false;
    $('disconnect').disabled = true;
}

$('connect').addEventListener('click', connect);
bindFile();
$('disconnect').addEventListener('click', disconnect);
bindInput($('video'));
</script>
</body>
</html>
