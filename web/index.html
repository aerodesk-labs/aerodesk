<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroDesk — Remote Desktop（浏览器原生 WebRTC）</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { background:#111; color:#eee; font-family: system-ui, sans-serif; margin:0; padding:16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color:#888; font-size:12px; margin-bottom:12px; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    input, select, button { padding:6px 10px; font-size:14px; border-radius:6px; border:1px solid #333; background:#1c1c1c; color:#eee; }
    button { cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.primary { background:#2ea043; border-color:#2ea043; }
    #status { font-size:13px; }
    #ice { font-size:12px; color:#888; }
    .wrap { position:relative; background:#000; border-radius:8px; overflow:hidden; }
    video { display:block; width:100%; max-height:70vh; background:#000; }
    .placeholder { display:flex; align-items:center; justify-content:center; height:200px; color:#555; font-size:14px; }
    #log { margin-top:10px; background:#0d0d0d; border:1px solid #222; border-radius:6px; padding:8px; font: 11px/1.5 ui-monospace, monospace; max-height:160px; overflow:auto; white-space:pre-wrap; color:#9aa; }
    @media (max-width: 600px) {
        body { padding:8px; }
        input { flex:1; min-width:0; }
        .bar { flex-direction: column; align-items: stretch; }
    }
</style>
</head>
<body>
    <h1>AeroDesk</h1>
    <div class="sub">浏览器原生 WebRTC · 观看端/发布端（与原生客户端互通）</div>
    <div class="bar">
        <select id="role">
            <option value="viewer">观看端</option>
            <option value="publisher">发布端（共享屏幕）</option>
        </select>
        <input id="room" placeholder="房间" value="demo">
        <input id="signal" placeholder="信令（默认 wss://host:3001/ws）" value="">
        <input id="token" placeholder="JWT（可选，仅本页读取）" value="">
        <button id="connect" class="primary">连接</button>
        <button id="disconnect" disabled>断开</button>
    </div>
    <div id="status">未连接</div>
    <div id="ice"></div>
    <div class="wrap">
        <video id="video" autoplay playsinline muted></video>
        <div id="placeholder" class="placeholder">等待媒体流…（观看端在视频上移动/点击即发送输入）</div>
    </div>
    <div id="log"></div>

<script>
'use strict';
// ---------- 参数（仅用于预填；运行期从输入框取值） ----------
const params = new URLSearchParams(location.search);
const rawRole = params.get('role') || 'viewer';
// #21：前端校验角色
const ROLE = (rawRole === 'publisher') ? 'publisher' : 'viewer';
const ROOM_PREFILL = params.get('room') || 'demo';
const SIGNAL_OVERRIDE = params.get('signal') || '';
const TOKEN_PREFILL = params.get('token') || '';

const byId = (id) => document.getElementById(id);
const $ = byId;

$('role').value = ROLE;
$('room').value = ROOM_PREFILL;
$('token').value = TOKEN_PREFILL;

let rtc = null, ws = null, peerId = null, inputChannel = null, signalChannel = null;
let pending = [], inputSeq = 0, closed = false, screenStream = null;

// ---------- 信令 ----------

function log(msg) {
    const el = $('log');
    el.innerText += new Date().toISOString().slice(11, 19) + ' ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
}
function setStatus(s) { $('status').innerText = s; }
function setIce(s) { $('ice').innerText = 'ICE: ' + s; }

// ---------- 信令 ----------
function signalURL() {
    if (SIGNAL_OVERRIDE) return SIGNAL_OVERRIDE;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const port = location.protocol === 'https:' ? 3001 : 3003;
    return `${proto}//${location.hostname}:${port}/ws`;
}
function sendSignal(msg) { ws.send(JSON.stringify(msg)); }

// #19：pending 队列按消息类型匹配 + 超时 + 可重置
function nextSignal(type, timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
        const item = { type, resolve, reject };
        pending.push(item);
        setTimeout(() => {
            const i = pending.indexOf(item);
            if (i >= 0) { pending.splice(i, 1); reject(new Error('信令超时: ' + type)); }
        }, timeoutMs);
    });
}
function resetPending() {
    for (const p of pending.splice(0)) p.reject(new Error('连接已重置'));
}

async function connectSignal() {
    await new Promise((resolve, reject) => {
        ws = new WebSocket(signalURL());
        ws.onopen = resolve;
        ws.onerror = () => reject(new Error('信令连接失败: ' + signalURL()));
    });
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        // 按类型匹配首个等待项
        const idx = pending.findIndex((p) => p.type === msg.type);
        if (idx >= 0) {
            const [item] = pending.splice(idx, 1);
            item.resolve(msg);
        } else {
            log('signal: ' + e.data);
        }
    };
    ws.onclose = () => { if (!closed) { setStatus('信令断开'); log('signaling closed'); } };
    log('signaling connected: ' + signalURL());
}

// ---------- ICE：非 trickle 需等 gathering 完成（#17） ----------
function waitIceGatheringComplete() {
    if (rtc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((resolve) => {
        rtc.addEventListener('icegatheringstatechange', () => {
            if (rtc.iceGatheringState === 'complete') resolve();
        });
    });
}
async function localSdp() {
    await waitIceGatheringComplete();
    return JSON.stringify(rtc.localDescription);
}

// ---------- 输入事件（InputFrame 协议） ----------
function normPos(e, el) {
    const rect = el.getBoundingClientRect();
    return {
        x: Math.min(1, Math.max(0, (e.clientX - rect.left) / (rect.width || 1))),
        y: Math.min(1, Math.max(0, (e.clientY - rect.top) / (rect.height || 1))),
    };
}
function sendInput(event) {
    if (!inputChannel || inputChannel.readyState !== 'open') return;
    const frame = { version: 1, seq: inputSeq++, timestamp_ms: Date.now(), event };
    inputChannel.send(JSON.stringify(frame));
}
const BTN = { 0: 'left', 1: 'middle', 2: 'right', 3: 'back', 4: 'forward' };
function modifiers(e) { return { ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey }; }
function bindInput(el) {
    el.addEventListener('mousemove', (e) => sendInput({ type: 'mouse_move', ...normPos(e, el) }));
    el.addEventListener('mousedown', (e) => sendInput({ type: 'mouse_button', button: BTN[e.button] || 'left', state: 'pressed', ...normPos(e, el) }));
    el.addEventListener('mouseup', (e) => sendInput({ type: 'mouse_button', button: BTN[e.button] || 'left', state: 'released', ...normPos(e, el) }));
    el.addEventListener('wheel', (e) => { e.preventDefault(); sendInput({ type: 'wheel', ...normPos(e, el), delta_x: e.deltaX || 0, delta_y: e.deltaY || 0 }); }, { passive: false });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); sendInput({ type: 'mouse_button', button: 'right', state: 'pressed', ...normPos(e, el) }); });
    el.addEventListener('touchstart', (e) => touch(e, 'down'), { passive: true });
    el.addEventListener('touchmove', (e) => touch(e, 'move'), { passive: true });
    el.addEventListener('touchend', (e) => touch(e, 'up'), { passive: true });
    el.addEventListener('touchcancel', (e) => touch(e, 'cancel'), { passive: true });
    window.addEventListener('keydown', (e) => sendInput({ type: 'key', code: e.code, state: 'pressed', modifiers: modifiers(e) }));
    window.addEventListener('keyup', (e) => sendInput({ type: 'key', code: e.code, state: 'released', modifiers: modifiers(e) }));
}
function touch(e, action) {
    for (const t of e.changedTouches) {
        const rect = $('video').getBoundingClientRect();
        sendInput({ type: 'touch', touch_id: t.identifier, action,
            x: Math.min(1, Math.max(0, (t.clientX - rect.left) / (rect.width || 1))),
            y: Math.min(1, Math.max(0, (t.clientY - rect.top) / (rect.height || 1))), });
    }
}

// ---------- WebRTC ----------
function setupRtc(iceServers) {
    rtc = new RTCPeerConnection({ iceServers });
    rtc.oniceconnectionstatechange = () => {
        setIce(rtc.iceConnectionState);
        if (rtc.iceConnectionState === 'failed' || rtc.iceConnectionState === 'disconnected') {
            setStatus('连接中断（ICE: ' + rtc.iceConnectionState + '）');
        }
    };
    rtc.onicecandidate = () => { /* v1 非 trickle：candidate 内嵌 SDP */ };

    signalChannel = rtc.createDataChannel('offer/answer');
    signalChannel.onmessage = (event) => {
        const json = JSON.parse(event.data);
        if (json.type === 'offer') handleOffer(event.data);
        else if (json.type === 'answer') {
            // negotiate() 的应答（data channel，与信令 WS 的 pending 队列分离）
            if (dcAnswerResolve) { dcAnswerResolve(event.data); dcAnswerResolve = null; }
        }
    };
    signalChannel.onopen = () => {
        inputChannel = rtc.createDataChannel('input');
        inputChannel.onopen = () => log('input channel open');
        inputChannel.onmessage = (e) => log('input event: ' + e.data);
        // #20：屏幕共享流已在点击时授权，这里直接加入连接
        if (ROLE === 'publisher' && screenStream) {
            const track = screenStream.getVideoTracks()[0];
            if (track) {
                rtc.addTransceiver(track, { direction: 'sendonly', streams: [screenStream] });
                negotiate();
                log('屏幕共享已加入连接');
            }
        } else if (ROLE === 'viewer') {
            log('viewer ready — 在视频上移动/点击发送输入');
        }
    };

    rtc.ontrack = (e) => {
        const video = $('video');
        video.srcObject = e.streams[0] || new MediaStream([e.track]);
        video.play().catch(() => {});
        $('placeholder').style.display = 'none';
        log('received track: ' + e.track.kind);
    };
}

let dcAnswerResolve = null;
async function negotiate() {
    const offer = await rtc.createOffer();
    await rtc.setLocalDescription(offer);
    await waitIceGatheringComplete();               // #17
    await signalChannel.send(JSON.stringify(rtc.localDescription));
    const answer = await new Promise((resolve) => { dcAnswerResolve = resolve; });
    await rtc.setRemoteDescription(JSON.parse(answer));
}
async function handleOffer(json) {
    const offer = JSON.parse(json);
    await rtc.setRemoteDescription(offer);
    const answer = await rtc.createAnswer();
    await rtc.setLocalDescription(answer);
    await waitIceGatheringComplete();               // #17
    await signalChannel.send(JSON.stringify(rtc.localDescription));
}

// ---------- 发布端：点击时先授权屏幕共享（#20） ----------
async function acquireScreen() {
    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
        screenStream.getVideoTracks()[0].addEventListener('ended', () => log('屏幕共享结束'));
        log('屏幕共享已授权');
    } catch (e) {
        log('屏幕共享被拒绝: ' + e.message);
        throw new Error('屏幕共享被拒绝');
    }
}

// ---------- 连接 ----------
async function connect() {
    closed = false;
    $('connect').disabled = true;
    $('disconnect').disabled = false;
    setStatus('连接中…');
    try {
        // #18：token 从输入框读取（URL 仅预填）
        const token = byId('token').value || null;

        // #20：发布端在用户点击手势内先请求屏幕共享
        if (ROLE === 'publisher') {
            setStatus('请求屏幕共享授权…');
            await acquireScreen();
        }

        setStatus('连接信令…');
        await connectSignal();
        sendSignal({ type: 'join', room: $('room').value || 'demo', role: ROLE, auth_token: token });
        const joined = await nextSignal('joined');
        peerId = joined.peer_id;
        setStatus('已加入房间，peer=' + peerId);

        let iceServers = [];
        if (joined.turn && joined.turn.urls) {
            iceServers = [{ urls: joined.turn.urls, username: joined.turn.username, credential: joined.turn.credential }];
            log('TURN relay: ' + joined.turn.urls.join(', '));
        }
        setupRtc(iceServers);

        const offer = await rtc.createOffer();
        await rtc.setLocalDescription(offer);
        const sdp = await localSdp();               // #17：等 gathering 完成
        sendSignal({ type: 'description', from: peerId, to: 'sfu', description: sdp });
        const resp = await nextSignal('description');
        await rtc.setRemoteDescription(JSON.parse(resp.description));
        setStatus('已连接');
        log('SDP 交换完成，等待媒体…');
    } catch (e) {
        setStatus('连接失败: ' + e.message);
        log('error: ' + e);
        stopScreen();
    } finally {
        $('connect').disabled = false;
    }
}

function stopScreen() {
    if (screenStream) {
        for (const t of screenStream.getTracks()) t.stop();
        screenStream = null;
    }
}

function disconnect() {
    closed = true;
    resetPending();
    dcAnswerResolve = null;
    if (inputChannel) { try { inputChannel.close(); } catch (_) {} }
    if (signalChannel) { try { signalChannel.close(); } catch (_) {} }
    if (rtc) rtc.close();
    if (ws) ws.close();
    stopScreen();
    rtc = null; ws = null; peerId = null; inputChannel = null; signalChannel = null;
    $('video').srcObject = null;
    $('placeholder').style.display = 'flex';
    setStatus('已断开');
    setIce('');
    $('connect').disabled = false;
    $('disconnect').disabled = true;
}

$('connect').addEventListener('click', connect);
$('disconnect').addEventListener('click', disconnect);
bindInput($('video'));
</script>
</body>
</html>
