name: Build & Release

# 打 tag v* 时自动构建 macOS（签名/公证）与 Linux（deb + tar.gz）桌面端，发 GitHub Release；
# 也可手动触发（只出产物）。
# 参考 ../abb 项目的 release 流水线（.github/workflows/release.yml）。
# macOS：DMG（Developer ID + notarytool）；Linux：cargo-deb .deb + 便携 tar.gz（scripts/package-linux.sh）。
# Windows：待 UI/WiX 落地后按本文件同构补。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────── macOS（Apple Silicon）───────────────────────────
  macos:
    # macos-15：默认 Xcode/Metal SDK 更新，避免 apple-metal swift-bridge 在
    # macos-14 旧 SDK 下编译失败（MTLLogState/MTLResidencySet 等新 API 缺失）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 镜像带多个 Xcode，自动选最新的（Slint/winit 的 Metal bridge 需要新 SDK）。
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "XCODE=$XCODE"
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE" || true

      # workspace 里 aerodesk-sfu 的 dev-dep str0m-netem 是路径依赖（../../../str0m），
      # cargo 解析 workspace 时必须能读到（与 CI test job 同款处理）。
      - name: Checkout str0m (netem dev-dep)
        shell: bash
        run: |
          if [ ! -d "${{ github.workspace }}/../str0m/.git" ]; then
            git clone --depth 1 https://github.com/PulseBeamDev/str0m.git "${{ github.workspace }}/../str0m"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # aerodesk-ui(macOS) 依赖 aerodesk-ffmpeg(ffmpeg-next) + x264（与 CI test job 一致）。
      - name: Install ffmpeg/x264
        run: brew install x264 ffmpeg

      - name: Build release (aarch64)
        run: cargo build --release --target aarch64-apple-darwin -p aerodesk-ui

      - name: Import Developer ID certificate (temporary keychain)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp /tmp/temp.keychain
          security default-keychain -s /tmp/temp.keychain
          security unlock-keychain -p temp /tmp/temp.keychain
          security import /tmp/cert.p12 -k /tmp/temp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp /tmp/temp.keychain
          IDENTITY=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Assemble AeroDesk.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash scripts/assemble-macos-app.sh "$VERSION" \
            target/aarch64-apple-darwin/release/aerodesk-ui dist/AeroDesk.app

      - name: Sign app (hardened runtime + timestamp)
        run: |
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/AeroDesk.app/Contents/MacOS/AeroDesk
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/AeroDesk.app
          codesign --verify --deep --strict --verbose=2 dist/AeroDesk.app

      - name: Notarize + staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/AeroDesk.app /tmp/AeroDesk-notarize.zip
          xcrun notarytool submit /tmp/AeroDesk-notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/AeroDesk.app
          spctl --assess --type execute --verbose=4 dist/AeroDesk.app || true

      - name: Package DMG (drag to Applications) + sign + notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p dmg-staging
          cp -R dist/AeroDesk.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AeroDesk" -srcfolder dmg-staging -ov -format UDZO "dist/AeroDesk-$VERSION.dmg"
          # DMG 也要签名 + 公证（分发盘片本身要过 Gatekeeper）
          codesign --force --sign "$IDENTITY" --timestamp "dist/AeroDesk-$VERSION.dmg"
          xcrun notarytool submit "dist/AeroDesk-$VERSION.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/AeroDesk-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/AeroDesk-$VERSION.dmg" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/AeroDesk-*.dmg
          if-no-files-found: error

  # ─────────────────────── Linux（x86_64，deb + tar.gz）───────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workspace 里 aerodesk-sfu 的 dev-dep str0m-netem 是路径依赖（../../../str0m），
      # cargo 解析 workspace 时必须能读到（与 CI test job 同款处理）。
      - name: Checkout str0m (netem dev-dep)
        shell: bash
        run: |
          if [ ! -d "${{ github.workspace }}/../str0m/.git" ]; then
            git clone --depth 1 https://github.com/PulseBeamDev/str0m.git "${{ github.workspace }}/../str0m"
          fi

      - uses: dtolnay/rust-toolchain@stable

      # aerodesk-ui(Linux) → aerodesk-linux(VAAPI, ffmpeg-next) + softenc(x264)：
      # 与 CI test job 的 ubuntu System deps 一致。
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libx264-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev libpostproc-dev libavdevice-dev libpipewire-0.3-dev libspa-0.2-dev rpm

      - name: Build release
        run: cargo build --release -p aerodesk-ui

      - name: Package Linux (deb + tar.gz + rpm + AppImage)
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error

  # ─────────────────────── Windows（x86_64，便携 ZIP）───────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # workspace 里 aerodesk-sfu 的 dev-dep str0m-netem 是路径依赖（../../../str0m），
      # cargo 解析 workspace 时必须能读到（与 CI test job 同款处理）。
      - name: Checkout str0m (netem dev-dep)
        shell: bash
        run: |
          if [ ! -d "${{ github.workspace }}/../str0m/.git" ]; then
            git clone --depth 1 https://github.com/PulseBeamDev/str0m.git "${{ github.workspace }}/../str0m"
          fi

      - uses: dtolnay/rust-toolchain@stable

      # aerodesk-ui/aerodesk-cli(Windows) 依赖 aerodesk-ffmpeg(ffmpeg-next)：与
      # test job 同款 BtbN 8.1 预编译共享构建（FFMPEG_DIR + PATH）。
      - name: System deps (Windows FFmpeg dev libs)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=$root"
          Add-Content $env:GITHUB_PATH (Join-Path $root "bin")

      - name: Build release (win64)
        shell: bash
        run: cargo build --release -p aerodesk-ui -p aerodesk-cli

      - name: Package Windows (portable ZIP)
        shell: bash
        run: bash scripts/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/aerodesk-*-win64.zip
            dist/aerodesk-*-win64.msi
          if-no-files-found: error

  # ─────────────────────────── 汇总发 Release ───────────────────────────
  release:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') # 只有打 tag 才发 Release；手动跑只出产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
