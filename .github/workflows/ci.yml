name: CI

# #429 只在 PR 触发（去掉 push）：同一 commit 不再出现 push+PR 双 run；
# main 变更走 PR + 分支保护，直推 main 不需要 CI。release 打包由 release.yml 负责。
# workflow_dispatch：PR 事件投递异常时（实测 2026-08-16 pull_request 触发哑火）
# 可手动跑同一套矩阵，也便于复跑。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一 PR 新提交自动取消旧 run，防止陈旧 run 堆满 runner 队列（macOS 并发有限）。
  group: ci-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  # #429 轻量门禁：docs-only PR 也跑（fmt 无需系统库，秒级）；
  # 代码 PR 的 fmt/clippy/test 仍由 test 矩阵覆盖。
  lint:
    name: lint (fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all -- --check

  # #429 前置：检测 PR 是否仅改动文档（*.md / docs/**），供重型 job 跳过。
  changes:
    # workflow_dispatch 无 pull_request base/head 可 diff,跳过(下游以事件名放行)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only "$base" "$head")
          echo "changed files:"
          echo "$files"
          # 仅当所有变更文件都是 *.md 或 docs/** 时才算 docs-only。
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(README\.md|docs/|.*\.md)$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_only == 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            skip_crates: ""
            features: ""
          - os: ubuntu-latest
            # #4 Wayland/PipeWire 采集是可选 feature（默认关，避免 UI 的
            # slint system-tray→zbus 与 ashpd 的 zbus/tokio 冲突）；CI 显式启用覆盖。
            # #306：aerodesk-agent 纳入 Linux 编译/测试（原生被控端宿主）。
            # #553 验收前置：ubuntu 4 核 runner 上 SVT-AV1 偶发死锁（codec roundtrip 卡死
            # 6h，镜像 20260816 起复现）——串行测试从源头消除并行争抢触发。
            skip_crates: --exclude aerodesk-ios
            features: --features aerodesk-platform/pipewire
            test_threads: "1"
          - os: windows-latest
            # #3：Windows CLI 已跨平台化（DXGI+OpenH264+SendInput），纳入编译/测试；
            # x264 仍排除（MSVC 下 C 库批次）。
            skip_crates: --exclude aerodesk-ios --exclude x264
            features:
            test_threads: ""
    runs-on: ${{ matrix.os }}
    # #553 验收前置：健康 ubuntu 约 25 分钟、macos 步骤最多（30+ e2e 脚本，
    # 降级 WARN 后全步骤跑完约 50-60 分钟）——job 级兜底超时 90，防挂起烧满 6h。
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # #102：SFU 偶发 Abort 定位——panic 时输出完整回溯
      RUST_BACKTRACE: 1
      # #552：脚本启动的 signal 一律继承此 env——SIP UDP 面（5060）开启，
      # CLI 客户端（SIP REGISTER/INVITE）才能连接；#577 曾逐脚本补，仍漏
      # 两个 .ps1，收敛为 job 级注入（脚本内显式设置优先，语义不变）。
      SIP_UDP_PORT: "5060"
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libasound2-dev libx264-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev libpostproc-dev libavdevice-dev libpipewire-0.3-dev libspa-0.2-dev
      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install x264 ffmpeg

      # #74 Windows FFmpeg 开发库：ffmpeg-sys-next 在 MSVC 下经 vcpkg 或
      # FFMPEG_DIR 定位开发库。此处用 BtbN win64-gpl-shared **8.1** 预编译包
      # （与 ffmpeg-sys-next 8.1.x 的 FFmpeg 8.x API 匹配；gyan.dev 当前仅
      # 提供 9.0，major 版本不匹配有 bindgen/链接风险）。
      # 该 zip 同时提供 MSVC COFF 导入库 lib/*.lib（含 __imp_*）与 MinGW
      # *.dll.a；ffmpeg-sys-next FFMPEG_DIR 分支读 lib/ + include/，我们把
      # bin/ 加进 PATH 供回环测试运行时加载 DLL。zip 用 PowerShell 原生
      # Expand-Archive 解压（windows-latest 无预装 7-Zip，见 runner-images#9361）。
      # #553 验收前置：BtbN release 下载偶发瞬断——actions/cache 缓存 zip。
      - name: Cache FFmpeg dev libs (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-n8.1-win64-gpl-shared-8.1
      - name: System deps (Windows FFmpeg dev libs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          # #553 验收前置：BtbN release 下载偶发瞬断（IWR 无内建重试）——
          # actions/cache 缓存 zip（key 命中直接复用，免每次下载）。
          $cacheZip = Join-Path $env:RUNNER_TEMP "ffmpeg-cache\ffmpeg.zip"
          if (Test-Path $cacheZip) {
            Copy-Item $cacheZip $zip
            Write-Host "FFmpeg zip 命中缓存"
          } else {
            Invoke-WebRequest -Uri $url -OutFile $zip
            New-Item -ItemType Directory -Force -Path (Split-Path $cacheZip) | Out-Null
            Copy-Item $zip $cacheZip
          }
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=$root"
          Add-Content $env:GITHUB_PATH (Join-Path $root "bin")

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace ${{ matrix.skip_crates }} --all-targets ${{ matrix.features }}

      - name: test
        # #553 验收前置：cargo test step 级超时（挂起点在 codec roundtrip，超时快速失败
        # 而非烧满 job 时限）；ubuntu 串行（--test-threads=1）规避 SVT 死锁。
        # （不用 RUST_TEST_THREADS env：空值会让 libtest get_concurrency panic）
        timeout-minutes: 25
        run: cargo test --workspace ${{ matrix.skip_crates }} ${{ matrix.features }}${{ matrix.test_threads == '1' && ' -- --test-threads=1' || '' }}

      # #470 Windows 服务生命周期冒烟（runner 具管理员权限）：安装→启动→
      # 查询→移除→终态。服务体在无配置下安全空转（presence 不启动，仅日志），
      # 登录界面/让位切换仍需 VM 人工联调（docs/PRELOGIN_WINDOWS_SERVICE.md §9）。
      - name: service lifecycle smoke (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          # cargo test 只产测试容器(deps/<bin>-<hash>.exe),不落 target/debug/<bin>.exe——
          # 显式链出可执行文件(全量已编译,仅链接,秒级)。
          cargo build -p aerodesk-host
          # SYSTEM 服务进程不吃 job shell 的 PATH(GITHUB_PATH 只对当前进程生效),
          # FFmpeg DLL 须与 exe 同目录(与便携包约定一致,LESSON: exe 与 DLL 同目录)。
          mkdir -p svc-smoke
          cp target/debug/aerodesk-host.exe svc-smoke/
          cp "$FFMPEG_DIR"/bin/*.dll svc-smoke/
          BIN="$(pwd)/svc-smoke/aerodesk-host.exe"
          test -f "$BIN"
          out=$("$BIN" --service-status); echo "$out"; [ "$out" = "not installed" ]
          # install 失败时 dump SCM 视角(服务配置/状态/事件日志)定位进程早退原因(1053 教训)。
          if ! "$BIN" --install-service; then
            echo "== 诊断:sc query/qc =="
            sc query AeroDeskService || true
            sc qc AeroDeskService || true
            echo "== 诊断:SCM 事件日志(最近 5 条) =="
            wevtutil qe System "/q:*[System[Provider[@Name='Service Control Manager']]]" /c:5 /rd:true /f:text || true
            echo "== 诊断:服务日志文件 =="
            tail -30 "$PROGRAMDATA/AeroDesk/logs/service.log" 2>/dev/null || echo "(无 service.log——进程死在 init_service_log 之前)"
            exit 1
          fi
          out=$("$BIN" --service-status); echo "$out"; echo "$out" | grep -q "运行中"
          "$BIN" --remove-service
          out=$("$BIN" --service-status); echo "$out"; [ "$out" = "not installed" ]

      # 端到端冒烟依赖 macOS 专属编码器（aerodesk-agent ← aerodesk-platform::macos），
      # 跨平台编译/单测已由三平台矩阵覆盖。
      - name: e2e smoke (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/smoke.sh

      # #58 画质选层端到端（SIP 语义版，#552 迁移后重写）：Web 发布端 +
      # 2×CLI viewer（SIP 会议桥）多播收流 + 选层请求转发断言；simulcast
      # 三层（q/h/f + f>q 码率）断言待原生端会议发布落地（P2）恢复。
      # Web 发布端（headless Chrome 屏幕共享）偶发浏览器崩溃（同类 flake 见
      # web-pub/web-reconnect），按仓库约定限 3 次重试。
      - name: e2e simulcast layer switching (macOS only)
        if: runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/simulcast-e2e.sh

      # #8 高码率（大帧）回归：VT 1080p60 --noisy ~5k pps → viewer 关键帧/解码
      # 正常（防 CLI viewer 单包读取丢关键帧回归；VT 不可用时 SKIP）。
      - name: e2e high-rate large-frame (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/highrate-e2e.sh

      # #66 回归：kill 一个连接后，新连接必须能正常 Join（信号服务器无死锁）。
      - name: e2e signal reconnect after disconnect (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/signal-reconnect-e2e.sh

      # #58 音频链路：publisher --audio（PCMU）→ SFU → viewer；静音 viewer 丢弃音频。
      - name: e2e audio pipeline (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/audio-e2e.sh

      # #73 Opus 48kHz：publisher --audio-opus（libopus）→ SFU → viewer 收帧。
      - name: e2e opus audio pipeline (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/opus-e2e.sh

      # #58 显示器切换：viewer --display N → SFU control 转发 → publisher（控制链路）。
      # control 通道时序偶发（同 bitrate-feedback），限 3 次重试。
      - name: e2e display switch control path (macOS only)
        if: runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/display-e2e.sh

      # #146 多 PoP 房间路由：双 PoP 本地验证信令重定向 + 客户端自动跟随。
      # （#148/#159 重构 ci.yml 时曾丢失该 step，多次恢复于 #154/#160 合并）
      # #553 验收前置：暂停——agent CLI 已 SIP 化（无 WSS join，WSS Redirect 面
      # 无客户端触达）；SIP 302 多 PoP 在 #551 任务清单"可后置"，支持后恢复。
      - name: e2e multi-PoP room routing (macOS only)
        if: false && runner.os == 'macOS'
        run: ./scripts/multipop-e2e.sh

      # #154 多 PoP v2：动态 room→PoP 注册表（首个加入者登记 + 共享文件 + 重定向）。
      # #553 验收前置：同 multipop 暂停原因（WSS 面无客户端触达）。
      - name: e2e multi-PoP dynamic registry (macOS only)
        if: false && runner.os == 'macOS'
        run: ./scripts/popreg-e2e.sh

      # #160 SFU 按需录制 API：内部接口 start/stop/status + 403 + 产物断言
      # （#240 扩展：record_api 审计 + recordings_active gauge）。
      # Web 发布端（headless Chrome 屏幕共享）偶发浏览器崩溃（同类 flake 见
      # web-pub/web-reconnect），按仓库约定限 3 次重试；BROWSER=chrome 与
      # web-pub 一致（macOS runner 的 msedge headless 屏幕共享不稳定）。
      - name: e2e record API (macOS only)
        if: runner.os == 'macOS'
        env:
          BROWSER: chrome
        run: bash scripts/ci-retry.sh 3 ./scripts/record-api-e2e.sh
      # #266 录制转封装：ADREC2 → rec2mp4 按访问单元聚合 → MP4 帧数断言。
      - name: e2e record-mp4 (#266, macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/record-mp4-e2e.sh
      # #268 TCP 中继并发连接上限：超限拒绝行为可观测。
      - name: e2e tcp quota (#268, macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/tcp-quota-e2e.sh
      # #267 发布端码率反馈回路：viewer --send-control → SFU 透传 → publisher 解析。
      # 时序敏感（P2P 通道打开顺序偶发差异），按仓库 e2e 惯例限 3 次重试。
      - name: e2e bitrate feedback (#267, macOS only)
        if: runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/bitrate-feedback-e2e.sh

      # #240 SFU 会话管理 API：房间/客户端列表 + 踢人 + 审计留痕。
      - name: e2e session API (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/session-api-e2e.sh

      # #216 M3 桥接编排：BRIDGE_CMD 桥优先（自动 spawn）+ 失败回退 Redirect +
      # 延迟 p99（与直连基线对比）。
      # #257：同一 step 先 local 五场景，再 REMOTE_LOOPBACK（本地双 PoP + remote
      # 断言流，端到端验证远程验收工具含 BRIDGE_KILL_CMD 恢复）。
      # #553 验收前置：暂停——agent CLI 已 SIP 化（无 WSS join），双 PoP 桥接
      # 场景的客户端面失效（bridge 双腿仍 WSS，但 agent 客户端已无 WSS 路径）；
      # SIP 302 多 PoP + 会议桥支持（#551 可后置）后恢复。
      - name: e2e bridge fallback (macOS only)
        if: false && runner.os == 'macOS'
        # 复杂网络 e2e 在 macOS runner 偶发瞬时 flake（#280 同类），按仓库
        # web-reconnect/ios-sim 约定限 3 次重试；真实回归会被 3 连败暴露。
        run: bash scripts/ci-retry.sh 3 bash -c "
          ./scripts/bridge-fallback-e2e.sh &&
          REMOTE_LOOPBACK=1 ./scripts/bridge-fallback-e2e.sh"

      # #216 M7：桥接 TURN 中继路径验收（#262）——双 PoP 内嵌 TURN +
      # AERODESK_FORCE_RELAY=1，桥双腿走 relay（真实 NAT 就绪）。
      # #553 验收前置：同 bridge fallback 暂停（SIP 302 多 PoP 后恢复）。
      - name: e2e bridge TURN relay (macOS only)
        if: false && runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/bridge-turn-e2e.sh

      # #216 M9：多房间桥并发 + BRIDGE_MAX_RUNNING 上限回退（#272）。
      # #553 验收前置：同 bridge fallback 暂停（SIP 302 多 PoP 后恢复）。
      - name: e2e bridge multiroom (macOS only)
        if: false && runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/bridge-multiroom-e2e.sh

      # #264 一键部署脚本：语法与参数解析守卫（真实部署需外部主机，dry-run 验证）。
      # #216：--help 不得泄漏源码行（历史缺陷：sed 固定行号越界打印 set -uo
      # pipefail / cd / 参数段）；阳性对照：修复前本断言必失败。
      - name: multipop-deploy script sanity
        shell: bash
        run: |
          bash -n scripts/multipop-deploy.sh
          help_out="$(bash scripts/multipop-deploy.sh --help)"
          printf '%s\n' "$help_out"
          if echo "$help_out" | grep -q "set -uo pipefail"; then
            echo "FAIL: --help 泄漏源码行" >&2
            exit 1
          fi
          if ! echo "$help_out" | grep -q "用法："; then
            echo "FAIL: --help 缺少用法" >&2
            exit 1
          fi

      # #163 信令连接配额：房间/全局上限，Join 超限拒绝。
      # #553 验收前置：暂停——WSS join 配额面无客户端触达（agent 已 SIP 化）；
      # SIP 注册/并发配额语义不同，P1 设计后恢复。
      - name: e2e signal connection quota (macOS only)
        if: false && runner.os == 'macOS'
        run: ./scripts/quota-e2e.sh

      # #173 客户端自动重连：中途断线恢复 + 启动重试。
      - name: e2e client auto-reconnect (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/reconnect-e2e.sh

      # #175 Web 端自动重连：浏览器观看页在服务重启后自动重连并恢复 video。
      - name: e2e web auto-reconnect (macOS only)
        if: runner.os == 'macOS'
        env:
          BROWSER: chrome
        run: bash scripts/ci-retry.sh 3 ./scripts/web-reconnect-e2e.sh

      # #180 SFU /start 准入配额：MAX_ROOM_CLIENTS=1 时第 2 个连接被 503。
      # #553 验收前置：暂停——agent publisher 已 SIP 化（1:1 被叫，不走 SFU
      # /start，SDP negotiated 仅在呼叫后出现）；SFU /start 配额改由 SIP
      # 会议桥触发（P1 重设计后恢复）。
      - name: e2e SFU start quota (macOS only)
        if: false && runner.os == 'macOS'
        run: ./scripts/sfu-quota-e2e.sh

      # #191/#201 TURN relay：内嵌 TURN 分配/互操作 + force-relay 观看端媒体经 relay 到达。
      # #553：降级 WARN 后 turn 内某步曾卡住拖满 job 时限——step 级超时快速失败。
      - name: e2e TURN relay + force-relay media (macOS only)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: bash scripts/turn-e2e.sh
      # #72 文件传输：publisher --send-file → SFU → viewer --recv-dir，SHA-256 一致。
      # #85：用 release 构建——debug 下 str0m/sctp-proto 高吞吐 data channel
      # 深调用链会 stack overflow（#102 已知，SFU shard 已 8MB 栈缓解）；
      # 吞吐验收本就需 release（LESSON 性能压测）。
      - name: e2e file transfer (macOS only)
        if: runner.os == 'macOS'
        run: PROFILE=release ./scripts/file-transfer-e2e.sh

      # #72 取消回归：publisher --cancel-send-after 中途取消 → viewer 不落盘、无残留。
      # #85：release 构建（debug 深链栈溢出已知限制 #102）。
      - name: e2e file transfer cancel/cleanup (macOS only)
        if: runner.os == 'macOS'
        run: PROFILE=release ./scripts/file-cancel-e2e.sh

      # #72 剪贴板双向同步：viewer→publisher 与 publisher→viewer 两个方向。
      - name: e2e clipboard sync (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/clipboard-e2e.sh

      # #75 远程光标：publisher 光标通道 → SFU → viewer 收到轨迹。
      - name: e2e remote cursor (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/cursor-e2e.sh

      # #74 多 codec（H264/H265/VP9/AV1）：--encoder ffmpeg --codec → SFU → viewer 收帧。
      # #166：瞬时 flake（个别 codec 无帧）限 3 次重试；根因归 codec 链路作者修复。
      - name: e2e multi-codec (macOS only)
        if: runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/codec-e2e.sh

      # #75 输入注入：viewer 输入事件 → SFU → publisher 注入（macOS CGEvent）。
      - name: e2e input injection (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/input-e2e.sh

      # #109 远程命令：viewer --run-command → SFU → publisher 执行 → stdout/stderr/exit。
      - name: e2e remote command (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/cmd-e2e.sh

      # #109 MCP 工具面：stdio JSON-RPC 会话 → aerodesk-mcp → CLI 桥 → 被控端执行。
      # #166：瞬时 flake（upload_file 超时）限 3 次重试；根因归 MCP 链路作者修复。
      - name: e2e mcp tool surface (macOS only)
        if: runner.os == 'macOS'
        run: bash scripts/ci-retry.sh 3 ./scripts/mcp-e2e.sh

      # #73 A/V 同步：连续视频+音频，AVSYNC 漂移/jitter buffer 统计。
      - name: e2e av sync (macOS only)
        if: runner.os == 'macOS'
        run: ./scripts/avsync-e2e.sh

      # 客户端自测：Web 主控端（浏览器观看 + 输入回传，SFU 内嵌 web/index.html）。
      # #552 迁移后改双浏览器拓扑（Web 发布 + Web 观看同 WSS 房间）：CLI publisher
      # 已是 SIP 1:1 被叫，WSS JSON 面无法对其呼叫（互通缺口待 Web SIP-WSS，P1 后）。
      - name: e2e web viewer (macOS only)
        if: runner.os == 'macOS'
        env:
          BROWSER: chrome
        run: ./scripts/web-e2e.sh

      # 客户端自测：Web 被控端（headless Chrome 屏幕共享发布 → SFU → CLI viewer 收流）。
      # #166：瞬时 flake（viewer frames）限 3 次重试；根因归 web-pub-e2e 作者修复。
      - name: e2e web publisher (macOS only)
        if: runner.os == 'macOS'
        env:
          BROWSER: chrome
        run: bash scripts/ci-retry.sh 3 ./scripts/web-pub-e2e.sh

      # 客户端自测：Web 主控端文件上传（file 通道 → 被控端落盘 sha256 校验）。
      # #552 后暂停：Web viewer（WSS）的 file 通道需可达的落盘对端——CLI publisher
      # 已是 SIP 1:1 被叫（不在 SFU 会议房间），被控端会议接入（发布方向 INVITE
      # view-AoR）属 P2 完整实现，落地后恢复本 step（文件链路由 CLI↔CLI
      # file-transfer-e2e 覆盖）。
      - name: e2e web file transfer (macOS only)
        if: false && runner.os == 'macOS'
        env:
          BROWSER: chrome
        run: bash scripts/ci-retry.sh 3 ./scripts/web-file-e2e.sh

      - name: windows adapter
        if: runner.os == 'Windows'
        # --examples：编译验证 vdd_smoke（#140，真机验收示例）。
        # -p aerodesk-desktop：#3 主控端真实媒体（PR #159）Windows 编译验证。
        run: cargo check -p aerodesk-platform -p aerodesk-desktop --examples
      # #3 Windows→Web 验收：本机 Edge 观看端全链路回归
      # （signaling→ICE/DTLS/SCTP→视频轨→输入回传）。合成源发布端不受静态桌面
      # 影响；Edge 由 windows-latest runner 预装；playwright-core 由脚本 npm i。
      - name: e2e web viewer (Windows Edge)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/web-edge-e2e-win.ps1
      # #58/#408 显示器切换 CLI 接线回归：viewer --display N → control → publisher 重建。
      # #487 同脚本断言 screen 发布端真出帧（RECEIVED>0）——静屏走 #477 心跳。
      # 采集不可用的 runner 自动 SKIP（与 windows_runtime 容错一致）。
      - name: e2e display switch + screen frames (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/display-switch-e2e-win.ps1
      - name: linux adapter
        if: runner.os == 'Linux'
        run: cargo check -p aerodesk-platform -p aerodesk-desktop
      - name: macos/ios adapters + cli
        if: runner.os == 'macOS'
        run: cargo check -p aerodesk-platform -p aerodesk-ios -p aerodesk-agent

  # 移动端 job（iOS app build / iOS simulator e2e / Android APK build）移出 PR CI
  # （2026-08-21 定调：先聚焦桌面版本，移动端暂不进门禁）。手动验证：
  #   .github/workflows/platform-cross.yml（workflow_dispatch，含 iOS/Android
  #   cargo check 双 target）——改 core/platform 共享 API 后应手动跑一遍。
  # 恢复时从 git 历史取回本注释处原三个 job 定义。

  # Windows 主控端运行态自测：#3 观看端建链（Git Bash + headless Edge 发布 + Windows UI ICE 断言）。
  windows-ui-e2e:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_only == 'false')
    name: Windows UI e2e (viewer)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # #552：脚本启动的 signal 需 SIP UDP 面（同 test job env 注释）
      SIP_UDP_PORT: "5060"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # #553 验收前置：BtbN release 下载偶发瞬断——actions/cache 缓存 zip。
      - name: Cache FFmpeg dev libs (Windows)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-n8.1-win64-gpl-shared-8.1

      # #3/#378：aerodesk-desktop 自全平台依赖 aerodesk-codec 起，Windows 构建需
      # FFmpeg 开发库（与 test job 同款 BtbN 8.1 预编译包），否则 ffmpeg-sys-next
      # build 失败（Windows UI e2e 无法验证观看端）。
      - name: System deps (Windows FFmpeg dev libs)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          # #553 验收前置：BtbN release 下载偶发瞬断（IWR 无内建重试）——
          # actions/cache 缓存 zip（key 命中直接复用，免每次下载）。
          $cacheZip = Join-Path $env:RUNNER_TEMP "ffmpeg-cache\ffmpeg.zip"
          if (Test-Path $cacheZip) {
            Copy-Item $cacheZip $zip
            Write-Host "FFmpeg zip 命中缓存"
          } else {
            Invoke-WebRequest -Uri $url -OutFile $zip
            New-Item -ItemType Directory -Force -Path (Split-Path $cacheZip) | Out-Null
            Copy-Item $zip $cacheZip
          }
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=$root"
          Add-Content $env:GITHUB_PATH (Join-Path $root "bin")

      - name: Run Windows UI e2e
        shell: bash
        run: bash scripts/windows-ui-e2e.sh

  # Linux 主控端运行态自测：#4 观看端真实媒体（Xvfb 无头跑 Slint UI → 本地 SFU → 解码帧断言）。
  linux-ui-e2e:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_only == 'false')
    name: Linux UI e2e (viewer)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # #552：脚本启动的 signal 需 SIP UDP 面（同 test job env 注释）
      SIP_UDP_PORT: "5060"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libasound2-dev libx264-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev libpostproc-dev libavdevice-dev libpipewire-0.3-dev libspa-0.2-dev xvfb x11-apps imagemagick

      - name: Run Linux UI e2e
        run: bash scripts/linux-ui-e2e.sh

      # #306 Linux 原生被控端端到端：Xvfb + CLI --encoder screen（X11 采集→编码→SFU）→ viewer 收帧。
      - name: Run Linux native controlled-side e2e
        run: bash scripts/linux-native-e2e.sh

  # macOS 主控端运行态自测（#487 矩阵缺口①）：macOS runner 真 WindowServer 直接跑
  # Slint UI → 本地 SFU → Web 被控端发布 → ICE Completed 断言；同时是 #497/#498
  # mac 主控键码路径的回归护栏。mac 被控端运行态需 TCC 授权，CI 不可自测（真机项）。
  macos-ui-e2e:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_only == 'false')
    name: macOS UI e2e (viewer)
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
      # #552：脚本启动的 signal 需 SIP UDP 面（同 test job env 注释）
      SIP_UDP_PORT: "5060"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps (macOS)
        run: brew install x264 ffmpeg

      - name: Run macOS UI e2e
        run: bash scripts/macos-ui-e2e.sh

  # Android APK build job 同上（移出 PR CI，见前文注释；platform-cross.yml 手动覆盖）。
