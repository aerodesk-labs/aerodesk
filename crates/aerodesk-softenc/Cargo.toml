[package]
name = "aerodesk-softenc"
description = "AeroDesk shared software H.264 encoder (x264, AnnexB, 4:2:0 WebRTC-compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
openh264 = "0.9.7"

# x264 软编需要系统库（pkg-config），Windows 无 → 仅非 Windows 启用；
# 解码（OpenH264）全平台可用。
[target.'cfg(not(windows))'.dependencies]
x264 = { path = "../x264" }
