[package]
name = "aerodesk-signal"
description = "AeroDesk SIP signaling server: REGISTER/INVITE endpoint (UDP/TLS/WSS) + ops HTTP(S) face"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rouille = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "2", features = ["tls"] }
# #503-4 临时密码 CSPRNG（与桌面端 generate_one_time_password 同源，拒绝采样；
# 访问口令不能用时间/进程态弱随机，见桌面端该函数注释）。
getrandom = "0.2"
# #10：仅依赖协议 crate，不再被迫链接客户端引擎重依赖。
aerodesk-protocol = { path = "../aerodesk-protocol" }
rsipstack = "0.6.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 测试证书生成（TLS e2e：CA + 服务端 EE，SAN 含 aerodesk.test/127.0.0.1）。
# 不用于生产——生产证书由部署的 CERT_FILE/KEY_FILE 提供（内嵌证书仅开发）。
[dev-dependencies]
rcgen = "0.14.8"
# #552 slice 5：P2P 媒体 e2e——两 UA 经 SIP 交换真实 str0m offer/answer，
# 双侧 ICE 建链 + 媒体载荷直达对端（媒体核心不 import SIP 类型）。
aerodesk-core = { path = "../aerodesk-core" }
str0m = { workspace = true }
