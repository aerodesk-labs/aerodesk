[package]
name = "aerodesk-signal"
description = "AeroDesk signaling server (WSS): rooms, auth, TURN credentials, SFU proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rouille = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "2", features = ["tls"] }
# #10：仅依赖协议 crate，不再被迫链接客户端引擎重依赖。
aerodesk-protocol = { path = "../aerodesk-protocol" }
rsipstack = "0.6.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 测试证书生成（TLS e2e：CA + 服务端 EE，SAN 含 aerodesk.test/127.0.0.1）。
# 不用于生产——生产证书由部署的 CERT_FILE/KEY_FILE 提供（内嵌证书仅开发）。
[dev-dependencies]
rcgen = "0.14.8"
