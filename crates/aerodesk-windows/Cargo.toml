[package]
name = "aerodesk-windows"
description = "AeroDesk Windows adapter: DXGI capture/scale, MF+OpenH264 encode, WASAPI audio, SendInput injection, Parsec VDD"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-softenc = { path = "../aerodesk-softenc" }
aerodesk-protocol = { path = "../aerodesk-protocol" }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# ADR-0001：虚拟显示器（Parsec VDD）。其传递依赖 windows 0.62 与下方 0.58 并存，
# 用 package 重命名 `windows062` 仅在本 crate 的 vdd 模块命名 HANDLE。
parsec-vdd-rust = "0.0.1"
windows062 = { package = "windows", version = "0.62", features = ["Win32_Foundation"] }
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D12",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
