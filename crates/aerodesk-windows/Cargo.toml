[package]
name = "aerodesk-windows"
description = "AeroDesk Windows adapter: DXGI/WGC capture, Media Foundation encode, SendInput injection (P4 skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-softenc = { path = "../aerodesk-softenc" }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D12",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
] }
