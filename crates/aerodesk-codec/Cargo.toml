[package]
name = "aerodesk-codec"
description = "AeroDesk FFmpeg codecs: H.265/HEVC + AV1 + VP9 (+H.264), hardware-accelerated when available"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aerodesk-core = { path = "../aerodesk-core" }
str0m = { workspace = true, features = ["rust-crypto"] }
openh264 = "0.9.7"
tracing.workspace = true
ffmpeg-next = "8"

# x264 软编需要系统库（pkg-config），Windows 无 → 仅非 Windows 启用；
# 解码（OpenH264）全平台可用。
[target.'cfg(not(windows))'.dependencies]
x264 = { path = "../x264" }
