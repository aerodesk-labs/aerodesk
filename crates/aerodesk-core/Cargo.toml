[package]
name = "aerodesk-core"
description = "Cross-platform remote desktop client core (str0m endpoint + media pipeline abstraction)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aerodesk-protocol = { path = "../aerodesk-protocol" }
str0m = { workspace = true, features = ["rust-crypto"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror = "2"  # #417 wss:// 支持（CLI/UI 连 WSS 信令）
pcap-file = "2.0.0"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "0.2"
webpki-roots = "0.26"
# #73 观看端音频播放（cpal：macOS CoreAudio / Windows WASAPI / Linux ALSA）。
cpal = "0.15"
# #271 剪贴板图片编解码（Linux 测试 + Windows 原生 DIB 路径共用）。
png = "0.17"
[target.'cfg(target_os = "linux")'.dependencies]
# #271 Linux 剪贴板：arboard（X11 x11rb / Wayland data-control，纯 Rust 无外部命令依赖）。
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

