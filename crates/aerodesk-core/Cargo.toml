[package]
name = "aerodesk-core"
description = "Cross-platform remote desktop client core (str0m endpoint + media pipeline abstraction)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
str0m = { workspace = true, features = ["rust-crypto"] }
aerodesk-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tungstenite = "0.30"
pcap-file = "2.0.0"
sha2 = "0.10"
sha1 = "0.10"
base64ct = { version = "1", features = ["std"] }
md-5 = "0.10"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "0.2"
webpki-roots = "0.26"
