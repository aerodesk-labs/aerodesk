[package]
name = "aerodesk-linux"
description = "AeroDesk Linux platform adapter compatibility shell (implementation moved to aerodesk-platform)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# 转发到 aerodesk-platform 的 PipeWire feature；消费方沿用
# `--features aerodesk-linux/pipewire` 不受影响。
pipewire = ["aerodesk-platform/pipewire"]

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
aerodesk-platform = { path = "../aerodesk-platform" }

[dev-dependencies]
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-protocol.workspace = true
