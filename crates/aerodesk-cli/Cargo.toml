[package]
name = "aerodesk-cli"
description = "AeroDesk CLI client: publisher (VP8 test stream) / viewer (stats)"
version.workspace = true
edition.workspace = true
license.workspace = true

# crate 收敛（2026-08-19）：bridge（#216 跨 PoP 媒体桥）与 mcp（#109 MCP 工具面）
# 由独立 crate 并入 cli 为多 bin 目标——两者运行时本就经 CLI 子进程/同机构建，
# 且 multipop-deploy 一直在同一台机器上构建 cli 与 bridge。
[[bin]]
name = "aerodesk-cli"
path = "src/main.rs"

[[bin]]
name = "aerodesk-bridge"
path = "src/bin/aerodesk-bridge.rs"

[[bin]]
name = "aerodesk-mcp"
path = "src/bin/aerodesk-mcp.rs"

[dependencies]
sha2 = "0.10"
aerodesk-codec = { path = "../aerodesk-codec" }
str0m = { workspace = true, features = ["rust-crypto"] }
aerodesk-core = { path = "../aerodesk-core" }

# CLI 端侧只依赖平台实现层，平台差异由 cfg 模块收敛。
aerodesk-platform = { path = "../aerodesk-platform" }
tungstenite = "0.30"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pcap-file = "2.0.0"
# viewer 诊断：AERODESK_DUMP_FRAME 把解码出的屏幕帧落盘成 PNG（端到端可视验证）。
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 专属：VideoToolbox 硬编 + SCK 采集/音频/CGEvent 注入（Windows/Linux 不编译）。
videotoolbox = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 被控端需要 PipeWire 采集/注入；CLI 无 slint/system-tray，无 zbus/tokio
# 主线程冲突。通用依赖在 Linux 下与下方 feature 合并。
aerodesk-platform = { path = "../aerodesk-platform", features = ["pipewire"] }
