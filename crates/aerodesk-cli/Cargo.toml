[package]
name = "aerodesk-cli"
description = "AeroDesk CLI client: publisher (VP8 test stream) / viewer (stats)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
aerodesk-ffmpeg = { path = "../aerodesk-ffmpeg" }
str0m = { workspace = true, features = ["rust-crypto"] }
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-macos = { path = "../aerodesk-macos" }
aerodesk-protocol.workspace = true
aerodesk-softenc = { path = "../aerodesk-softenc" }
tungstenite = "0.30"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pcap-file = "2.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
videotoolbox = "0.18"
