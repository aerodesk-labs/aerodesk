[package]
name = "aerodesk-cli"
description = "AeroDesk CLI client: publisher (VP8 test stream) / viewer (stats)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
aerodesk-ffmpeg = { path = "../aerodesk-ffmpeg" }
str0m = { workspace = true, features = ["rust-crypto"] }
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-protocol.workspace = true
aerodesk-softenc = { path = "../aerodesk-softenc" }
tungstenite = "0.30"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pcap-file = "2.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 专属：VideoToolbox 硬编 + SCK 采集/音频/CGEvent 注入（Windows/Linux 不编译）。
aerodesk-macos = { path = "../aerodesk-macos" }
videotoolbox = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 被控端：DXGI 采集 + SendInput 注入（编码走全平台 aerodesk-softenc）。
aerodesk-windows = { path = "../aerodesk-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 被控端：X11/Wayland(portal) 采集 + XTest/uinput 注入 + VAAPI/x264 编码（#4/#306，Wayland 批次）。
# 启用 pipewire feature（CLI 无 slint/system-tray，无 zbus/tokio 主线程冲突；
# UI 保持默认 feature 不受影响——feature 按包统一，但 UI 构建命令不包含 aerodesk-cli）。
aerodesk-linux = { path = "../aerodesk-linux", features = ["pipewire"] }
