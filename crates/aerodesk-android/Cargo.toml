[package]
name = "aerodesk-android"
description = "AeroDesk Android JNI shell (platform implementation moved to aerodesk-platform)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.21"
aerodesk-core = { path = "../aerodesk-core" }

[target.'cfg(target_os = "android")'.dependencies]
aerodesk-platform = { path = "../aerodesk-platform" }
