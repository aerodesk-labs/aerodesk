[package]
name = "aerodesk-android"
description = "AeroDesk Android JNI + Slint host (platform implementation moved to aerodesk-platform)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.21"
aerodesk-core = { path = "../aerodesk-core" }

[build-dependencies]
slint-build = "1"

[target.'cfg(target_os = "android")'.dependencies]
aerodesk-platform = { path = "../aerodesk-platform" }
slint = { version = "1", default-features = false, features = ["std", "backend-android-activity-06", "renderer-software", "compat-1-2"] }
