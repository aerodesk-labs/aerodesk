[package]

name = "aerodesk-ios"
description = "AeroDesk iOS/iPad FFI + Slint host (platform implementation moved to aerodesk-platform)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]

[build-dependencies]
slint-build = "1"

[target.'cfg(target_os = "ios")'.dependencies]
aerodesk-platform = { path = "../aerodesk-platform" }
aerodesk-core = { path = "../aerodesk-core" }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
