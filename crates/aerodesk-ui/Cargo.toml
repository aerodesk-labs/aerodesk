[package]
name = "aerodesk-ui"
description = "AeroDesk cross-platform UI shell (Slint): connect/room/settings, 7 platforms one codebase"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slint = "1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
str0m = { workspace = true, features = ["rust-crypto"] }
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-protocol = { path = "../aerodesk-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
aerodesk-macos = { path = "../aerodesk-macos" }

[build-dependencies]
slint-build = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
