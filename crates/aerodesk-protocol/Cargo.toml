[package]
name = "aerodesk-protocol"
description = "Cross-platform shared protocol types (signal/chat/cmd/input/file + jwt/tls/turn helpers)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
base64ct = { version = "1", features = ["std"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rsipstack = "0.6.4"
# sip_client(#552):UA 自带独立 tokio runtime(与 aerodesk-signal 同版本/特性)。
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
# rustls 仅用于显式装默认 CryptoProvider（见 sip_client::ensure_rustls_provider）：
# 工作区同时 pin ring(core/rsipstack) 与 aws_lc_rs(sfu)，--workspace 联合构建下
# rustls 无法自动判定 provider，rsipstack 的 ClientConfig::builder() 会 panic。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# 系统根证书 PEM 包（sip_client::system_ca_pem——rsipstack 不自动加载系统根）。
rustls-native-certs = "0.8"
