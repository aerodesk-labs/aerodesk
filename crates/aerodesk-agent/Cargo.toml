[package]
name = "aerodesk-agent"
description = "AeroDesk 客户端引擎（被控端发布/观看/控制），headless 可被桌面端 spawn、可开机自启"
version.workspace = true
edition.workspace = true
license.workspace = true

# 2026-08-19 更名 cli→agent：本 crate 是被控端引擎而非「命令行工具」——
# 桌面端 spawn 它、自启安装它、mcp 桥它；host(ADR-0009) 是服务宿主，agent 是引擎。
# crate 收敛：bridge（#216 跨 PoP 媒体桥）与 mcp（#109 MCP 工具面）并入为多 bin
# 目标——两者运行时本就经 agent 子进程/同机构建，multipop-deploy 一直在同一台
# 机器上构建 agent 与 bridge。
[[bin]]
name = "aerodesk-agent"
path = "src/main.rs"

[[bin]]
name = "aerodesk-bridge"
path = "src/bin/aerodesk-bridge.rs"

[[bin]]
name = "aerodesk-mcp"
path = "src/bin/aerodesk-mcp.rs"

[dependencies]
sha2 = "0.10"
aerodesk-codec = { path = "../aerodesk-codec" }
str0m = { workspace = true, features = ["rust-crypto"] }
aerodesk-core = { path = "../aerodesk-core" }

# 端侧只依赖平台实现层，平台差异由 cfg 模块收敛。
aerodesk-platform = { path = "../aerodesk-platform" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pcap-file = "2.0.0"
# #503-4 --temp-password：signal 管理端点签发临时密码（HTTP 客户端；signal
# 同款 ureq，工作区已有锁版本，非新增传输依赖）。
ureq = { version = "2", features = ["tls"] }
# viewer 诊断：AERODESK_DUMP_FRAME 把解码出的屏幕帧落盘成 PNG（端到端可视验证）。
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 专属：VideoToolbox 硬编 + SCK 采集/音频/CGEvent 注入（Windows/Linux 不编译）。
videotoolbox = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 被控端需要 PipeWire 采集/注入；agent 无 slint/system-tray，无 zbus/tokio
# 主线程冲突。通用依赖在 Linux 下与下方 feature 合并。
aerodesk-platform = { path = "../aerodesk-platform", features = ["pipewire"] }
