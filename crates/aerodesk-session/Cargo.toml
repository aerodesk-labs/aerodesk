[package]
name = "aerodesk-session"
description = "AeroDesk 会话编排层（#508 B1）：主控 viewer / 被控 publisher 引擎，UI 无关；desktop/host 经 SessionUi 缝接线"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aerodesk-core = { path = "../aerodesk-core" }
aerodesk-codec = { path = "../aerodesk-codec" }
aerodesk-platform = { path = "../aerodesk-platform" }
str0m = { workspace = true, features = ["rust-crypto"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
videotoolbox = "0.18"
