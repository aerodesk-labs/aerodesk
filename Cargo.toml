[workspace]
resolver = "2"
members = [
    "crates/aerodesk-sfu",
    "crates/aerodesk-protocol",
    "crates/aerodesk-core",
    "crates/aerodesk-signal",
    "crates/aerodesk-cli",

    "crates/aerodesk-ios",
    "crates/aerodesk-android",
    "crates/aerodesk-ohos",
    "crates/aerodesk-host",
    "crates/aerodesk-ipc",
    "crates/aerodesk-session",
    "crates/aerodesk-desktop",
    "crates/aerodesk-codec",
    "crates/aerodesk-bridge",
    "crates/aerodesk-mcp",
    "crates/aerodesk-dashboard",
    "crates/aerodesk-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aerodesk-labs/aerodesk"
rust-version = "1.85"

[workspace.dependencies]
# PulseBeam's str0m fork (feat/bwe-fixes, pinned): production-grade BWE fixes
# (pacer/padding, probe robustness, set_current_bitrate). Same MIT/Apache license.
# 指向 aerodesk-labs 派生（7db621f + #85 dimpl DTLS receive queue 2048 +
# acd7e77 SCTP send buffer 8MB / rwnd 8MB），避免 data channel 大文件突发
# 触发 Receive queue full 断连，并解除单 SACK 周期在途字节瓶颈（100MB <60s）。
str0m = { git = "https://github.com/aerodesk-labs/str0m.git", rev = "f5b4fd6e79d23f8bc368873603f453c05314b4e2", default-features = false }
rouille = { version = "3.6.2", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
systemstat = "0.2.2"
aerodesk-protocol = { path = "crates/aerodesk-protocol" }

[profile.release]
lto = "thin"

# apple-cf 本地补丁：支持 iOS/iOS-Simulator 交叉编译（Swift 桥按 TARGET 选 triple/SDK）
[patch.crates-io]
apple-cf = { path = "vendor/apple-cf" }
videotoolbox = { path = "vendor/videotoolbox" }
