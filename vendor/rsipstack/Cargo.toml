[package]
edition = "2021"
name = "rsipstack"
version = "0.6.4"
authors = ["jinti<shenjindi@fourz.cn>"]
build = false
exclude = [
    "examples/",
    "assets/*",
    ".github/*",
    "Dockerfile*",
    ".dockerignore",
    "flake.lock",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SIP Stack Rust library for building SIP applications"
readme = "README.md"
keywords = [
    "sip",
    "voip",
    "telephony",
    "sipstack",
]
categories = [
    "network-programming",
    "multimedia",
]
license = "MIT"
repository = "https://github.com/restsend/rsipstack"

[features]
all-transports = [
    "rustls",
    "websocket",
    "srv_lookup",
]
default = [
    "rustls",
    "websocket",
    "srv_lookup",
]
rustls = [
    "tokio-rustls",
    "rustls-pki-types",
]
srv_lookup = ["dep:hickory-resolver"]
# aerodesk patch：websocket 需要 tungstenite 类型（sink/read 类型擦除用 Error/Result）
websocket = ["tokio-tungstenite", "dep:tungstenite"]

[lib]
name = "rsipstack"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[bin]]
name = "bench_ua"
path = "src/bin/bench_ua.rs"

[dependencies.async-trait]
version = "0.1.89"

[dependencies.base64]
version = "0.22"

[dependencies.bytes]
version = "1.11.1"

[dependencies.clap]
version = "4.5.53"
features = ["derive"]

[dependencies.dashmap]
version = "6"

[dependencies.futures]
version = "0.3.32"

[dependencies.futures-util]
version = "0.3.32"

[dependencies.hickory-resolver]
version = "0.26.1"
features = [
    "system-config",
    "tokio",
]
optional = true

[dependencies.if-addrs]
version = "0.14"

[dependencies.md-5]
version = "0.11.0"

[dependencies.memchr]
version = "2"

[dependencies.parking_lot]
version = "0.12"

[dependencies.rand]
version = "0.10.1"

[dependencies.rustls]
version = "0.23"
features = ["ring"]
default-features = false

[dependencies.rustls-pki-types]
version = "1"
features = ["alloc"]
optional = true

[dependencies.sha2]
version = "0.11.0"

[dependencies.socket2]
version = "0.6.3"
features = ["all"]

[dependencies.thiserror]
version = "2.0.18"

[dependencies.tokio-rustls]
version = "0.26"
features = [
    "ring",
    "tls12",
    "logging",
]
optional = true
default-features = false

[dependencies.tokio-tungstenite]
version = "0.29.0"
optional = true

# aerodesk patch：websocket 类型别名（dyn Sink/Stream）引用的 Error/Result 类型
[dependencies.tungstenite]
version = "0.29.0"
default-features = false
optional = true

[dependencies.tokio-util]
version = "0.7.18"
features = ["full"]

[dependencies.tracing]
version = "0.1.44"

[dependencies.tracing-subscriber]
version = "0.3.22"
features = ["local-time"]

[dev-dependencies.axum]
version = "0.8.8"
features = ["ws"]

[dev-dependencies.dotenvy]
version = "0.15.7"

[dev-dependencies.http]
version = "1.4.0"

[dev-dependencies.rtp-rs]
version = "0.6.0"

[dev-dependencies.sdp-rs]
version = "0.2.1"

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.tower]
version = "0.5.3"

[dev-dependencies.tower-http]
version = "0.6.8"
features = [
    "fs",
    "cors",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.50.0"
features = ["full"]

[target.'cfg(target_arch = "wasm32")'.dependencies.tokio]
version = "1.50.0"
features = [
    "time",
    "sync",
    "macros",
    "io-util",
]
